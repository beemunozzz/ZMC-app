<title>ZMC Hub</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: a dispatch board. Week of day columns on desktop, a day-by-day list on phones; a slide-over panel for job details and editing. Same navy, blanket blue and tape tan as the ZMC site. */
:root{
  --bg:#F3F0EA; --panel:#FFFFFF; --ink:#15202B; --muted:#5B6470; --line:#E2DBD0; --soft:#F8F6F2;
  --blue:#1F4E8C; --blue-soft:#E3EAF4; --tape:#D9A25B; --tape-soft:#F6EAD8;
  --ok:#2F6B45; --ok-soft:#E1EFE5; --warn:#A4541A; --warn-soft:#F8E8DA; --bad:#A3302A; --bad-soft:#F7E1DF; --on-accent:#FFFFFF;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif; --body:"Inter",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12171D; --panel:#1B222B; --ink:#ECE8E1; --muted:#A3ABB5; --line:#2E3742; --soft:#222A34;
  --blue:#8FB2E6; --blue-soft:#22324A; --tape:#E0B072; --tape-soft:#3A2F20;
  --ok:#7CC496; --ok-soft:#1E3326; --warn:#F0A86E; --warn-soft:#3A2A1F; --bad:#F08A80; --bad-soft:#3D2220; --on-accent:#12171D; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12171D; --panel:#1B222B; --ink:#ECE8E1; --muted:#A3ABB5; --line:#2E3742; --soft:#222A34;
  --blue:#8FB2E6; --blue-soft:#22324A; --tape:#E0B072; --tape-soft:#3A2F20;
  --ok:#7CC496; --ok-soft:#1E3326; --warn:#F0A86E; --warn-soft:#3A2A1F; --bad:#F08A80; --bad-soft:#3D2220; --on-accent:#12171D; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:1400px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
.wrap>*{min-width:0}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.appbar{display:flex;align-items:center;justify-content:space-between;gap:12px;min-width:0}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .mark{background:var(--ink);color:var(--bg);font-family:var(--display);font-weight:800;font-size:15px;letter-spacing:.04em;border-radius:7px;padding:4px 7px;line-height:1}
.brand h1{margin:0;font-family:var(--display);font-weight:800;font-size:26px;text-transform:uppercase;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.appactions{display:flex;align-items:center;gap:8px;flex-shrink:0}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px}
.menuwrap{position:relative}
.menubtn{position:relative;font-size:18px;line-height:1}
.menubtn .dot{position:absolute;top:6px;right:6px;width:8px;height:8px;border-radius:50%;background:var(--bad)}
.menu{position:absolute;right:0;top:calc(100% + 6px);z-index:30;width:min(280px,calc(100vw - 32px));background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 32px rgba(0,0,0,.18);padding:6px;display:grid;gap:2px}
.mgroup{display:grid;gap:2px;padding:6px 4px}
.mgroup+.mgroup{border-top:1px solid var(--line)}
.mlabel{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:2px 8px 4px}
.mgroup .sel{width:100%}
.mitem{display:flex;align-items:center;justify-content:space-between;width:100%;border:0;background:transparent;text-align:left;padding:10px 8px;border-radius:8px;font-weight:600;cursor:pointer;min-height:42px}
.mitem:hover{background:var(--soft)}
.badge{background:var(--bad);color:#fff;font-size:11px;font-weight:700;border-radius:999px;padding:2px 7px}
@media (prefers-reduced-motion:no-preference){.menu:not([hidden]){animation:zpop .16s ease-out;transform-origin:top right}}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:9px 14px;font-weight:600;cursor:pointer;min-height:40px}
a.btn{text-decoration:none;display:inline-flex;align-items:center}a.btn:not(.primary){color:var(--ink)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:var(--on-accent)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.icon{padding:9px 12px}
.sel{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:9px 10px;min-height:40px;max-width:100%}
.weeknav{display:flex;align-items:center;gap:6px}
.weeknav strong{font-family:var(--display);font-size:22px;font-weight:700;min-width:12ch;text-align:center}
.summary{display:flex;flex-wrap:wrap;gap:8px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:14px}
.stat b{font-variant-numeric:tabular-nums}
.note{background:var(--tape-soft);border-radius:8px;padding:10px 14px;font-size:14px}
.board{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px;align-items:start}
@media (max-width:1050px){.board{grid-template-columns:1fr}}
.day{background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:10px;display:grid;gap:8px;min-width:0;align-content:start;min-height:140px}
.day.today{border-color:var(--blue);box-shadow:inset 0 3px 0 var(--blue)}
.dayhead{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.dayhead b{font-family:var(--display);font-size:20px;text-transform:uppercase;letter-spacing:.02em}
.dayhead span{font-size:13px;color:var(--muted)}
.empty{font-size:13px;color:var(--muted);padding:6px 2px}
.addday{border:1px dashed var(--line);background:transparent;border-radius:8px;padding:8px;color:var(--muted);cursor:pointer;font-size:13px}
.job{text-align:left;width:100%;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--blue);border-radius:8px;padding:10px;display:grid;gap:6px;cursor:pointer;min-width:0}
.job.s-confirmed{border-left-color:var(--ok)}
.job.s-done{border-left-color:var(--muted);opacity:.75}
.job.s-canceled{border-left-color:var(--bad);opacity:.6}
.job.s-canceled .cust{text-decoration:line-through}
.jrow{display:flex;justify-content:space-between;gap:6px;align-items:center;flex-wrap:wrap}
.time{font-weight:700;font-variant-numeric:tabular-nums}
.cust{font-weight:600;overflow-wrap:anywhere}
.route{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--blue-soft);color:var(--blue);white-space:nowrap}
.chip.lead{background:var(--tape-soft);color:var(--ink)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.mute{background:var(--soft);color:var(--muted);border:1px solid var(--line)}
.pwrap{display:grid;gap:8px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:6px}
.pgrid:empty{display:none}
.pthumb{border:0;padding:0;border-radius:8px;overflow:hidden;aspect-ratio:1;background:var(--soft);cursor:pointer;position:relative}
.pthumb img{width:100%;height:100%;object-fit:cover;display:block}
.pthumb .pby{position:absolute;left:0;right:0;bottom:0;font-size:10px;font-weight:700;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.6));padding:8px 4px 3px;text-align:left}
.paddrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.paddrow .btn.sm{min-height:34px;padding:6px 12px;font-size:13px;display:inline-flex;align-items:center;cursor:pointer}
.pstat{font-size:13px;color:var(--muted)}
.lightbox{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.lightbox img{max-width:100%;max-height:calc(100% - 110px);object-fit:contain;border-radius:8px}
.lbbar,.lbconfirm{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;width:min(640px,100%);color:#fff;font-size:14px}
.lbconfirm{background:#3a1d1d;border-radius:8px;padding:8px 10px}
.overlay{position:fixed;inset:0;background:rgba(10,14,20,.45);z-index:20;display:flex;justify-content:flex-end}
.sheet{background:var(--panel);width:min(560px,100%);height:100%;overflow-y:auto;padding:20px max(20px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) 20px;padding-top:calc(20px + env(safe-area-inset-top,0px));display:grid;gap:16px;align-content:start}
.sheethead{display:flex;justify-content:space-between;align-items:start;gap:12px}
.sheethead h2{margin:0;font-family:var(--display);font-size:30px;font-weight:800;text-transform:uppercase;line-height:1.05;overflow-wrap:anywhere}
.kv{display:grid;grid-template-columns:110px minmax(0,1fr);gap:8px 12px;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;overflow-wrap:anywhere}
.section{display:grid;gap:8px}
.section h3{margin:0;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.callout{border-radius:8px;padding:10px 12px;font-size:14px}
.callout.warn{background:var(--warn-soft);color:var(--warn)}
.callout.info{background:var(--blue-soft);color:var(--blue)}
form.edit{display:grid;gap:12px}
.frow{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
label.f{display:grid;gap:4px;font-size:13px;font-weight:600;min-width:0}
label.f input,label.f select,label.f textarea{border:1px solid var(--line);background:var(--soft);border-radius:6px;padding:9px 10px;width:100%;min-width:0}
textarea{min-height:70px;resize:vertical}
.pick{display:flex;flex-wrap:wrap;gap:6px}
.pick label{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:14px;background:var(--soft)}
.pick label:has(input:checked){background:var(--blue-soft);border-color:var(--blue);color:var(--blue);font-weight:600}
.pick input{margin:0;accent-color:var(--blue)}
.actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between}
.crewrow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.crewrow div{min-width:0;overflow-wrap:anywhere}
.err{color:var(--bad);font-size:14px;margin:0}
.ct{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:12px}
.ct h2{margin:0;font-family:var(--display);font-size:26px;text-transform:uppercase;letter-spacing:.01em}
.cthead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:8px}
.ctm{font-size:14px;color:var(--muted);margin:0;overflow-wrap:anywhere}
.ctgrid{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:16px;align-items:start}
@media (max-width:760px){.ctgrid{grid-template-columns:1fr}}
.ctjob{display:grid;gap:8px;min-width:0}
.ctlab{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--blue)}
.cttime{font-family:var(--display);font-size:34px;font-weight:700;line-height:1}
.ctcust{font-weight:700;font-size:18px;overflow-wrap:anywhere}
.ctaddr{display:grid;gap:2px;font-size:14px;overflow-wrap:anywhere}
.ctbtns{display:flex;flex-wrap:wrap;gap:8px}
.house{border:1px solid var(--line);background:var(--soft);border-radius:10px;padding:10px 12px;display:grid;gap:6px}
.hlab{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.hline{font-weight:600;overflow-wrap:anywhere}
.hsrc{font-size:12px;color:var(--muted)}
.house .btn.sm{min-height:34px;padding:6px 10px;font-size:13px}
.afield{display:grid;gap:6px}
.lookrow{display:flex;flex-wrap:wrap;gap:6px}
.pastebox{display:grid;gap:6px;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:10px}
.lookrow .btn.sm{min-height:34px;padding:6px 12px;font-size:13px}
.astat{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.astat:empty{display:none}
.astat b{color:var(--ok)}
.astat .btn.sm{min-height:30px;padding:4px 10px;font-size:13px;margin-top:4px}
.spin{display:inline-block;width:12px;height:12px;border:2px solid var(--line);border-top-color:var(--blue);border-radius:50%;vertical-align:-1px;margin-right:4px}
@media (prefers-reduced-motion:no-preference){.spin{animation:zspin .8s linear infinite}}
@keyframes zspin{to{transform:rotate(360deg)}}
.hgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;font-weight:600;max-width:calc(100vw - 32px);box-shadow:0 8px 24px rgba(0,0,0,.2)}
@media (max-width:600px){.hgrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.ctbtns .btn{text-decoration:none;display:inline-flex;align-items:center;min-height:44px}
.ctrow{display:flex;flex-wrap:wrap;gap:8px}
.ctside{display:grid;gap:8px}
.btn.clock{width:100%;min-height:68px;font-size:18px;display:grid;gap:2px;justify-items:center;background:var(--ok);border-color:var(--ok);color:var(--on-accent)}
.btn.clock.out{background:var(--bad);border-color:var(--bad)}
.btn.clock span{font-size:13px;font-weight:500}
.btn.clock:disabled{opacity:.5;cursor:not-allowed}
.invt{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.invt td{padding:7px 0;border-bottom:1px solid var(--line)}
.invt td:last-child{text-align:right;white-space:nowrap}
.invtotal{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.invtotal b{font-family:var(--display);font-size:36px;line-height:1}
.sigwrap{display:grid;gap:6px}
.sig{width:100%;height:160px;background:#FFFFFF;border:1.5px dashed var(--line);border-radius:10px;touch-action:none;cursor:crosshair;display:block}
.sigimg{background:#FFFFFF;border:1px solid var(--line);border-radius:10px;max-width:100%;height:auto;display:block}
.nte-ok{background:var(--ok-soft);color:var(--ok);border-radius:8px;padding:8px 12px;font-size:14px}
.nte-bad{background:var(--bad-soft);color:var(--bad);border-radius:8px;padding:8px 12px;font-size:14px;font-weight:600}
.invrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;cursor:pointer}
.invrow b{overflow-wrap:anywhere}
.saved{display:flex;align-items:center;gap:10px;background:var(--ok-soft);color:var(--ok);border-radius:10px;padding:12px 14px;font-weight:700}
.saved svg{flex-shrink:0}
/* Motion: quick ease-out, transform and opacity only, off for reduced motion */
@media (prefers-reduced-motion:no-preference){
  .btn,.job,.invrow{transition:transform .12s ease-out,background-color .15s ease-out,border-color .15s ease-out}
  .btn:active:not(:disabled),.job:active,.invrow:active{transform:scale(.97)}
  .overlay{animation:zfade .2s ease-out}
  .sheet{animation:zsheet .26s cubic-bezier(.23,1,.32,1)}
  .saved svg{animation:zpop .32s cubic-bezier(.23,1,.32,1)}
}
@keyframes zfade{from{opacity:0}}
@keyframes zsheet{from{transform:translateX(20px);opacity:0}}
@keyframes zpop{from{transform:scale(.85);opacity:0}}
.main{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:16px;align-items:start}
.main>.board,.main>.month{min-width:0}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);min-width:0}
@media (max-width:1050px){.main{grid-template-columns:1fr}.side{order:-1;position:static}}
#crewpanel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
#crewpanel summary{cursor:pointer;list-style:none;display:flex;gap:10px;align-items:center;font-family:var(--display);font-weight:700;font-size:20px;text-transform:uppercase;min-height:32px}
#crewpanel summary::-webkit-details-marker{display:none}
.burger{font-size:18px;color:var(--muted)}
.sidelist{display:grid;gap:12px;margin-top:12px}
.srow{display:grid;gap:3px}
.srow .sn{display:flex;justify-content:space-between;gap:8px;font-weight:600}
.srow .sm{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.srow.off .sn span:first-child{color:var(--muted)}
.sbar{height:6px;background:var(--soft);border-radius:999px;overflow:hidden}
.sbar i{display:block;height:100%;background:var(--blue);border-radius:999px}
.job.nocrew{border:2px dashed var(--bad);border-left:4px solid var(--bad);background:var(--bad-soft)}
.nocrewbox{display:grid;gap:2px;font-size:13px;color:var(--bad);min-width:0;overflow-wrap:anywhere;white-space:normal}
.nocrewbox b{font-weight:700;text-transform:uppercase;letter-spacing:.03em}
.job{overflow:hidden}
.job>*{min-width:0;max-width:100%;overflow-wrap:anywhere}
.mjob.nocrew{border-left-color:var(--bad);background:var(--bad-soft)}
.mjob.nocrew .mc{color:var(--bad);font-weight:700}
.crewbar{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;gap:8px}
.crewbar .cbrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.crewbar .cbt{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-right:4px}
.crewbar .chip{font-size:13px;padding:4px 10px;font-variant-numeric:tabular-nums}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:transparent;padding:9px 14px;font-weight:600;cursor:pointer;min-height:40px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.month{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.mhead{font-size:12px;font-weight:700;text-transform:uppercase;color:var(--muted);letter-spacing:.06em;padding:0 4px}
.mcell{background:var(--soft);border:1px solid var(--line);border-radius:8px;min-height:120px;padding:6px;display:flex;flex-direction:column;gap:3px;min-width:0}
.mcell.out{opacity:.45}
.mcell.today{border-color:var(--blue);box-shadow:inset 0 3px 0 var(--blue)}
.mday{align-self:flex-start;border:0;background:none;font-weight:700;cursor:pointer;padding:2px 6px;border-radius:4px;font-variant-numeric:tabular-nums}
.mcell.today .mday{background:var(--blue);color:var(--on-accent)}
.mjob{border:0;border-left:3px solid var(--blue);background:var(--panel);text-align:left;font-size:12px;line-height:1.3;padding:4px 6px;border-radius:4px;cursor:pointer;width:100%;display:grid;gap:1px;min-width:0}
.mjob .ml{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mjob .mc{color:var(--muted)}
.crewline{font-size:13px;overflow-wrap:anywhere}
.crewline b{font-weight:600}
.hrsline{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.mjob .mt{font-weight:700;font-variant-numeric:tabular-nums}
.mjob.s-confirmed{border-left-color:var(--ok)}
.mjob.s-done{opacity:.6;border-left-color:var(--muted)}
.mjob.s-canceled{text-decoration:line-through;opacity:.5;border-left-color:var(--bad)}
.mjob.cf{border-left-color:var(--bad);background:var(--bad-soft)}
.mmore{border:0;background:none;color:var(--blue);font-size:12px;font-weight:600;cursor:pointer;text-align:left;padding:2px 6px}
.mcell{position:relative}
.mtop{display:flex;align-items:center;justify-content:space-between;gap:2px;min-height:26px}
.mwx{position:relative;display:inline-flex;align-items:center;line-height:0;flex-shrink:0}
@media (max-width:380px){.mday{font-size:12px!important}.mcell.today .mday{padding:1px 2px!important}.mwx .wxe{font-size:10px!important}}
.mdot{position:absolute;right:0;bottom:0;width:6px;height:6px;border-radius:50%;background:var(--warn);box-shadow:0 0 0 1.5px var(--soft)}
.mwx{padding:0 1px 1px 0}

<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const DAYS=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
const WEATHER={"":{t:"No forecast yet",c:"mute"},clear:{t:"Clear",c:"ok"},cloudy:{t:"Cloudy",c:"mute"},rain:{t:"Rain likely",c:"warn"},hot:{t:"Hot (100°F+)",c:"warn"},wind:{t:"Windy",c:"warn"},fog:{t:"Fog",c:"warn"}};
const WXE={clear:"☀️",cloudy:"☁️",rain:"🌧️",fog:"☁️",hot:"🔥",wind:"💨"};
function wxSvg(k,sz){const e=WXE[k];if(!e)return"";return `<span class="wxe" style="font-size:${sz||16}px" aria-hidden="true">${e}</span>`;}
function wxChip(k){const w=WEATHER[k]||WEATHER[""];return `<span class="chip ${w.c} wxchip">${wxSvg(k,14)}${w.t}</span>`;}
const WXRANK=["rain","hot","wind","fog","cloudy","clear"];
let forecast={};
const WEATHER_TIP={rain:"Rain expected: bring extra blankets, plastic covers and floor runners.",hot:"Hot day: extra water, start early, take breaks in the shade.",wind:"Windy: strap loads tight and watch mattresses and boxes on the ramp.",fog:"Morning fog (tule fog): leave early and drive carefully."};
const STATUS={booked:{t:"Booked",c:"chip"},confirmed:{t:"Confirmed",c:"chip ok"},done:{t:"Done",c:"chip mute"},canceled:{t:"Canceled",c:"chip bad"}};
const pad=n=>String(n).padStart(2,"0");
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse=s=>{const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d);};
const monday=d=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());const k=(x.getDay()+6)%7;x.setDate(x.getDate()-k);return x;};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x;};
const fmtTime=t=>{if(!t)return"Time TBD";const[h,m]=t.split(":").map(Number);return`${((h+11)%12)+1}:${pad(m)} ${h<12?"am":"pm"}`;};
const fh=n=>String(Math.round(n*10)/10);
const endOf=j=>{if(!j.start||!j.hours)return"";const[h,m]=j.start.split(":").map(Number);const t=h*60+m+Math.round(Number(j.hours)*60);return`${pad(Math.floor(t/60)%24)}:${pad(t%60)}`;};
const span=j=>{const e=endOf(j);if(!e)return fmtTime(j.start);const a=fmtTime(j.start),b=fmtTime(e);return a.slice(-2)===b.slice(-2)?`${a.slice(0,-3)} – ${b}`:`${a} – ${b}`;};
const fmtDay=d=>d.toLocaleDateString(undefined,{weekday:"long",month:"short",day:"numeric"});
const city=a=>{if(!a)return"";const p=a.split(",").map(s=>s.trim()).filter(Boolean);return p.length>1?p[p.length-2].replace(/\s+\d{5}$/,"").replace(/\s+[A-Z]{2}$/,""):p[0];};

let db=null, canWrite=false, crew=[], jobs=[], week=monday(new Date());
let view="week", month=new Date(new Date().getFullYear(),new Date().getMonth(),1);
try{if(localStorage.getItem("zmc-view")==="month")view="month";}catch(e){}
let who=""; try{who=localStorage.getItem("zmc-who")||"";}catch(e){}
let openJob=null, loaded={crew:false,jobs:false};
let uid=null, myCrew="", myEntries=[], logs={}, logSubs={}, curJobId="";
let invoices={}, invSubs={};
// Pricing (from Brandon): $65 per mover per hour, 2-hour minimum, $1/mile truck, $20 materials + $5 water
const S={rate:65,minHours:2,perMile:1,materials:20,water:5,phone:"(209) 326-5601",freeTrip:25,tripStep:25,tripHours:0.5};
let quotes=[], sampler=null;
let pstatus={};
let pastLooks=[];
const normAddr=a=>String(a||"").toLowerCase().replace(/[.,#]/g," ").replace(/\b\d{5}(-\d{4})?\b/g," ").replace(/\b(ca|california|usa)\b/g," ")
  .replace(/\b(street)\b/g,"st").replace(/\b(avenue)\b/g,"ave").replace(/\b(place)\b/g,"pl").replace(/\b(drive)\b/g,"dr").replace(/\b(road)\b/g,"rd").replace(/\b(court)\b/g,"ct").replace(/\b(lane)\b/g,"ln").replace(/\b(boulevard)\b/g,"blvd").replace(/\b(circle)\b/g,"cir").replace(/\b(way)\b/g,"way")
  .replace(/\s+/g," ").trim();
let officePhotos={}, offSubs={}, crewPhotos={}, cphSubs={};
function subOffice(pk){ // pk = "jobs:ID" or "quotes:ID"
  if(!db||!pk||offSubs[pk])return; const [k,id]=pk.split(":"); if(!id)return;
  offSubs[pk]=db.collection((k==="quotes"?"quotephotos/":"jobphotos/")+id+"/items").onSnapshot(q=>{officePhotos[pk]=q.docs.map(d=>({id:d.id,_path:(k==="quotes"?"quotephotos/":"jobphotos/")+id+"/items/"+d.id,...d.data()}));paintPhotos();},()=>{});
}
function subCrewPhotos(u){
  if(!db||!u||cphSubs[u]||Object.keys(cphSubs).length>=50)return;
  cphSubs[u]=db.collection("crewphotos/"+u+"/items").onSnapshot(q=>{crewPhotos[u]=q.docs.map(d=>({id:d.id,_u:u,_path:"crewphotos/"+u+"/items/"+d.id,...d.data()}));paintPhotos();},()=>{});
}
function photosFor(pk){
  const [k,id]=pk.split(":"); const out=[...(officePhotos[pk]||[])];
  if(k==="jobs")Object.values(crewPhotos).forEach(a=>a.forEach(p=>{if(p.jobId===id)out.push(p);}));
  return out.sort((a,b)=>String(a.at||"").localeCompare(String(b.at||"")));
}
function photoBox(pk,canAdd){
  subOffice(pk);
  return `<div class="pwrap"><div class="pgrid" data-pk="${esc(pk)}"></div>${canAdd?`<div class="paddrow"><button type="button" class="btn sm" data-addphoto="${esc(pk)}">+ Add photos</button><span class="pstat" data-pstat="${esc(pk)}"></span></div>`:""}</div>`;
}
function paintPhotos(){
  document.querySelectorAll(".pgrid[data-pk]").forEach(g=>{
    const ps=photosFor(g.dataset.pk);
    g.innerHTML=ps.map((p,i)=>`<button type="button" class="pthumb" data-photo="${esc(g.dataset.pk)}" data-pi="${i}" aria-label="Open photo ${i+1}"><img src="${p.data&&String(p.data).startsWith("data:image/")?p.data:""}" alt="" loading="lazy">${p.byName?`<span class="pby">${esc(p.byName)}</span>`:""}</button>`).join("");
    const st=document.querySelector(`[data-pstat="${CSS.escape(g.dataset.pk)}"]`);if(st)st.textContent=pstatus[g.dataset.pk]||(ps.length?"":"No photos yet");
  });
}
async function shrinkImage(file,maxSide){
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((ok,bad)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=bad;i.src=url;});
    for(const [max,q] of (maxSide?[[maxSide,.82],[1280,.72]]:[[1280,.72],[1024,.62],[800,.55]])){
      const r=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
      const c=document.createElement("canvas");c.width=Math.round(img.naturalWidth*r);c.height=Math.round(img.naturalHeight*r);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      const d=c.toDataURL("image/jpeg",q); if(d.length<450000)return d;
    }
    throw new Error("too big");
  } finally{URL.revokeObjectURL(url);}
}
async function addPhotos(pk,files){
  const [k,id]=pk.split(":"); let done=0, bad=0;
  const say=t=>{pstatus[pk]=t;paintPhotos();};
  for(const f of files){
    say(`Adding photo ${done+bad+1} of ${files.length}…`);
    try{
      const data=await shrinkImage(f);
      const me=crew.find(c=>c.id===(canWrite?"zach":myCrew));
      const body={data,at:new Date().toISOString(),byName:canWrite?"Office":(me?me.name:"Crew")};
      if(canWrite) await db.collection((k==="quotes"?"quotephotos/":"jobphotos/")+id+"/items").doc().set(body);
      else await db.collection("crewphotos/"+uid+"/items").doc().set({...body,jobId:id,crewId:myCrew});
      done++;
    }catch(x){bad++;}
  }
  say(bad?`${done} added. ${bad} couldn't be added (try a JPG or PNG photo).`:`${done} photo${done===1?"":"s"} added.`);
  setTimeout(()=>{delete pstatus[pk];paintPhotos();},6000);
  if(!canWrite)subCrewPhotos(uid);
}
let lbPhoto=null, quoteSaver=null;
function openPhoto(pk,i){
  const p=photosFor(pk)[i]; if(!p)return; lbPhoto=p;
  $("lb-img").src=p.data; $("lb-cap").textContent=`${p.byName||""}${p.at?" · "+new Date(p.at).toLocaleString([], {month:"short",day:"numeric",hour:"numeric",minute:"2-digit"}):""}`;
  $("lb-del").hidden=!(canWrite||(p._u&&p._u===uid)); $("lb-confirm").hidden=true; $("lightbox").hidden=false; $("lb-close").focus();
}
function closePhoto(){$("lightbox").hidden=true;$("lb-img").src="";lbPhoto=null;}
const money=n=>"$"+(Math.round((Number(n)||0)*100)/100).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
const allInvoices=()=>Object.values(invoices).flat();
function subInvoices(u){
  if(!u||invSubs[u]||Object.keys(invSubs).length>=50)return;
  invSubs[u]=db.collection("invoices/"+u+"/items").onSnapshot(q=>{invoices[u]=q.docs.map(d=>({id:d.id,_u:u,...d.data()}));render();},()=>{});
}

function crewName(id){const c=crew.find(x=>x.id===id);return c?c.name:"Removed crew member";}
function jobCrew(j){return [j.leadId,...(j.crewIds||[])].filter(Boolean);}

const mins=t=>{if(!t)return null;const[h,m]=t.split(":").map(Number);return h*60+m;};
function overlaps(a,b){
  // job times overlap, allowing 30 minutes to drive between jobs
  const as=mins(a.start),bs=mins(b.start);if(as==null||bs==null)return true;
  const ae=as+(Number(a.hours)||2)*60+30, be=bs+(Number(b.hours)||2)*60+30;
  return as<be&&bs<ae;
}
function conflicts(j){
  // crew members also booked on an overlapping job the same day
  const mine=new Set(jobCrew(j));const out=[];
  jobs.forEach(o=>{if(o.id===j.id||o.date!==j.date||o.status==="canceled"||j.status==="canceled"||!overlaps(j,o))return;
    jobCrew(o).forEach(id=>{if(mine.has(id))out.push({id,other:o});});});
  return out;
}

function render(){
  // crew members only ever see their own jobs
  const crewMode=!canWrite&&!!myCrew;
  if(crewMode) who=myCrew;
  $("m-view").hidden=crewMode; syncMenu();
  renderToday();
  // who filter options
  const sel=$("who");const keep=who;
  sel.innerHTML=`<option value="">Everyone</option>`+crew.map(c=>`<option value="${esc(c.id)}">${esc(c.name)}</option>`).join("");
  sel.value=crew.some(c=>c.id===keep)?keep:"";
  $("v-week").setAttribute("aria-pressed",view==="week");$("v-month").setAttribute("aria-pressed",view==="month");
  let start,end;
  if(view==="month"){start=new Date(month);end=new Date(month.getFullYear(),month.getMonth()+1,0);
    $("weeklabel").textContent=month.toLocaleDateString(undefined,{month:"long",year:"numeric"});}
  else{start=week;end=addDays(week,6);
    const thisMon=monday(new Date());
    $("weeklabel").textContent=+week===+thisMon?"This week":`${week.toLocaleDateString(undefined,{month:"short",day:"numeric"})} – ${end.toLocaleDateString(undefined,{month:"short",day:"numeric"})}`;}

  const visible=jobs.filter(j=>!who||jobCrew(j).includes(who));
  const wk=visible.filter(j=>j.date>=iso(start)&&j.date<=iso(end));
  const todayIso=iso(new Date());
  const todayJobs=visible.filter(j=>j.date===todayIso&&j.status!=="canceled");
  const guysToday=new Set(jobs.filter(j=>j.date===todayIso&&j.status!=="canceled").flatMap(jobCrew));
  const weatherFlags=wk.filter(j=>["rain","hot","wind","fog"].includes(j.weather)&&j.status!=="canceled");
  const conflictJobs=wk.filter(j=>conflicts(j).length);
  const sum=[];
  if(!loaded.jobs) sum.push(`<span class="stat">Loading the schedule…</span>`);
  else{
    sum.push(`<span class="stat">Today: <b>${todayJobs.length}</b> job${todayJobs.length===1?"":"s"}${who?"":` · <b>${guysToday.size}</b> guys out`}</span>`);
    sum.push(`<span class="stat">${view==="month"?"This month":"This week"}: <b>${wk.filter(j=>j.status!=="canceled").length}</b> jobs</span>`);
    const act=wk.filter(j=>j.status!=="canceled");
    const hrs=act.reduce((s,j)=>s+(Number(j.hours)||0),0);
    const crewHrs=act.reduce((s,j)=>s+(Number(j.hours)||0)*jobCrew(j).length,0);
    const open=act.reduce((s,j)=>s+Math.max(0,(Number(j.movers)||0)-jobCrew(j).length),0);
    sum.push(`<span class="stat">Est. hours: <b>${fh(hrs)}</b> · <b>${fh(crewHrs)}</b> crew-hours</span>`);
    const nocrew=act.filter(j=>!jobCrew(j).length).length;
    if(nocrew) sum.push(`<span class="stat" style="color:var(--bad);border-color:var(--bad)">⚠ No crew assigned: <b>${nocrew}</b> job${nocrew===1?"":"s"}</span>`);
    sum.push(open?`<span class="stat" style="color:var(--warn)">Open spots: <b>${open}</b> mover${open===1?"":"s"} still needed</span>`:`<span class="stat" style="color:var(--ok)">Every job fully staffed</span>`);
    if(weatherFlags.length) sum.push(`<span class="stat" style="color:var(--warn)">Weather to watch: <b>${weatherFlags.length}</b> job${weatherFlags.length===1?"":"s"}</span>`);
    if(conflictJobs.length) sum.push(`<span class="stat" style="color:var(--bad)">Double-booked: <b>${conflictJobs.length}</b> job${conflictJobs.length===1?"":"s"}</span>`);
  }
  $("summary").innerHTML=sum.join("");

  // Crew hours for the period, and who's working today
  const cb=$("crewbar");
  if(loaded.jobs&&crew.length){
    const period=jobs.filter(j=>j.date>=iso(start)&&j.date<=iso(end)&&j.status!=="canceled");
    const per=crew.map(c=>{const js=period.filter(j=>jobCrew(j).includes(c.id));return{c,n:js.length,h:js.reduce((s,j)=>s+(Number(j.hours)||0),0)};})
      .sort((a,b)=>b.h-a.h);
    const todays=jobs.filter(j=>j.date===todayIso&&j.status!=="canceled");
    const on=crew.filter(c=>todays.some(j=>jobCrew(j).includes(c.id)));
    const off=crew.filter(c=>!on.includes(c));
    const max=Math.max(1,...per.map(p=>p.h));
    $("sidetitle").textContent=`Crew ${view==="month"?"this month":"this week"}`;
    $("sidelist").innerHTML=per.map(p=>`<div class="srow${p.n?"":" off"}">
        <div class="sn"><span>${esc(p.c.name)}</span><span class="sm">${p.n?fh(p.h)+" hrs":"—"}</span></div>
        <div class="sm">${p.n?`${p.n} job${p.n===1?"":"s"}`:"Not assigned"}${p.c.role&&p.c.role!=="Mover"?` · ${esc(p.c.role)}`:""}${clockedLine(p.c.id,start,end)}</div>
        <div class="sbar" aria-hidden="true"><i style="width:${p.n?Math.max(4,p.h/max*100):0}%"></i></div></div>`).join("");
    $("side").hidden=false;
    cb.innerHTML=`<div class="cbrow"><span class="cbt">Today</span>${on.length?on.map(c=>`<span class="chip ok">${esc(c.name)} working</span>`).join(""):`<span class="chip mute">Nobody scheduled</span>`}${off.map(c=>`<span class="chip mute">${esc(c.name)} off</span>`).join("")}</div>`;
    cb.hidden=false;
  } else {cb.hidden=true;$("side").hidden=true;}

  $("board").className=view==="month"?"month":"board";
  if(view==="month"){$("board").innerHTML=monthHTML(visible,todayIso);return;}
  let html="";
  for(let i=0;i<7;i++){
    const d=addDays(week,i), di=iso(d);
    const list=wk.filter(j=>j.date===di).sort((a,b)=>(a.start||"99").localeCompare(b.start||"99"));
    html+=`<section class="day${di===todayIso?" today":""}" aria-label="${esc(fmtDay(d))}">
      <div class="dayhead"><b>${DAYS[i]}</b><span>${d.toLocaleDateString(undefined,{month:"short",day:"numeric"})}</span></div>
      ${list.map(card).join("")||`<div class="empty">${loaded.jobs?"No jobs":""}</div>`}
      ${canWrite?`<button class="addday" data-add="${di}">+ Add job</button>`:""}
    </section>`;
  }
  $("board").innerHTML=html;
  if(openJob){const j=jobs.find(x=>x.id===openJob);if(j&&!$("sheet").querySelector("form"))showJob(j);}
}

// ---- Clock-ins and the crew's "Today" view ----
function entriesFor(crewId){const all=canWrite?Object.values(logs).flat():myEntries;return all.filter(e=>e.crewId===crewId);}
function hoursOf(list,from,to){return list.reduce((s,e)=>{if(!e.in)return s;const a=new Date(e.in),d=iso(a);if(d<from||d>to)return s;const b=e.out?new Date(e.out):new Date();return s+Math.max(0,(b-a)/36e5);},0);}
function clockedLine(id,start,end){
  if(!canWrite)return"";

function wireSig(){
  const c=$("sig"), ctx=c.getContext("2d"); let drawing=false, dirty=false;
  const r=c.getBoundingClientRect(), d=window.devicePixelRatio||1;
  c.width=Math.round(r.width*d); c.height=Math.round(r.height*d); ctx.scale(d,d);
  ctx.lineWidth=2.4; ctx.lineCap="round"; ctx.lineJoin="round"; ctx.strokeStyle="#111821";
  const pt=e=>{const b=c.getBoundingClientRect();return[e.clientX-b.left,e.clientY-b.top];};
  c.addEventListener("pointerdown",e=>{drawing=true;dirty=true;try{c.setPointerCapture(e.pointerId);}catch(x){}const[x,y]=pt(e);ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+.1,y+.1);ctx.stroke();});
  c.addEventListener("pointermove",e=>{if(!drawing)return;const[x,y]=pt(e);ctx.lineTo(x,y);ctx.stroke();});
  ["pointerup","pointercancel","pointerleave"].forEach(t=>c.addEventListener(t,()=>{drawing=false;}));
  $("sig-clear").onclick=()=>{ctx.clearRect(0,0,c.width,c.height);dirty=false;};
  return ()=>{
    if(!dirty)return"";
    // shrink to a light image before saving
    const out=document.createElement("canvas"); out.width=600; out.height=Math.round(600*c.height/c.width);
    const o=out.getContext("2d"); o.fillStyle="#FFFFFF"; o.fillRect(0,0,out.width,out.height); o.drawImage(c,0,0,out.width,out.height);
    return out.toDataURL("image/png");
  };
}

// Price math from Brandon's rules: labor + trip charge + truck miles + materials/water
function priceOf(q,extraHrs){
  const mv=Math.max(2,Number(q.movers)||2), hrs=Math.max(S.minHours,(Number(q.hours)||0)+(extraHrs||0));
  const out=Number(q.milesOut)||0, mid=Number(q.milesBetween)||0, back=Number(q.milesBack)||0;
  const labor=hrs*mv*S.rate;
  const steps=out+back<=S.freeTrip?0:Math.ceil((out+back-S.freeTrip)/S.tripStep);
  const trip=steps*S.tripHours*S.rate*mv;
  const truck=q.truck==="theirs"?0:(out+mid+back)*S.perMile;
  const supplies=S.materials+S.water;
  return {mv,hrs,labor,trip,steps,truck,supplies,total:labor+trip+truck+supplies};
}

}

function customerList(){
  const map={};
  const key=(n,p)=>(p||"").replace(/\D/g,"")||(n||"").toLowerCase().trim();
  jobs.forEach(j=>{if(!j.customer)return;const k=key(j.customer,j.phone);const c=map[k]||(map[k]={name:j.customer,phone:j.phone||"",jobs:0,last:"",spent:0,heard:""});
    c.jobs++; if(j.date>c.last)c.last=j.date; if(j.phone&&!c.phone)c.phone=j.phone;});
  allInvoices().forEach(v=>{const j=jobs.find(x=>x.id===v.jobId);const k=key(v.customer,j&&j.phone);if(map[k])map[k].spent+=v.total||0;});
  quotes.forEach(q=>{const k=key(q.name,q.phone);if(map[k]&&q.heard)map[k].heard=q.heard;});
  return Object.values(map).sort((a,b)=>b.last.localeCompare(a.last));
}

      </div>
      <div class="frow">
        <label class="f">Type of job<select id="f-type">${["Full move","Partial move","Garage only","Same property","Storage unit","Pod load/unload","Office move","Labor only"].map(t=>`<option ${opt(t,j.moveType)}>${t}</option>`).join("")}</select></label>
        <label class="f">Truck<select id="f-truck"><option value="ours" ${opt("ours",j.truck)}>We bring ours</option><option value="theirs" ${opt("theirs",j.truck)}>Customer has their own</option></select></label>
        <label class="f">Status<select id="f-status">${Object.entries(STATUS).map(([k,v])=>`<option value="${k}" ${opt(k,j.status)}>${v.t}</option>`).join("")}</select></label>
      </div>
      <div class="frow">
        <label class="f">Est. hours<input type="number" id="f-hours" min="0" step="0.5" value="${esc(j.hours||"")}"></label>
        <label class="f">Movers needed<select id="f-movers">${[2,3,4,5,6].map(n=>`<option ${n==j.movers?"selected":""}>${n}</option>`).join("")}</select></label>
        <label class="f">Crew lead<select id="f-lead">${leadOpts}</select></label>
      </div>
      <div class="section"><h3>Movers on this job</h3><div class="pick" id="f-crew">${picks}</div></div>
      <div class="frow">
        <label class="f">Weather<select id="f-weather">${Object.entries(WEATHER).map(([k,v])=>`<option value="${k}" ${opt(k,j.weather||"")}>${k?v.t:"No forecast yet"}</option>`).join("")}</select></label>
        <label class="f">Weather note<input type="text" id="f-wnote" value="${esc(j.weatherNote||"")}" placeholder="e.g. High 58°F, 70% rain after 2pm"></label>
      </div>
      <label class="f">Heavy or special items<input type="text" id="f-items" value="${esc(j.items||"")}"></label>
      <label class="f">Notes for the crew<textarea id="f-notes">${esc(j.notes||"")}</textarea></label>
      <p class="err" id="f-err" hidden></p>
      <div class="actions">
        <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary" type="submit">${isNew?"Add to schedule":"Save changes"}</button><button class="btn" type="button" data-close>Cancel</button></div>
        ${isNew?"":`<button class="btn danger" type="button" id="f-del">Delete job</button>`}
      </div>
      <div id="f-confirm" hidden class="callout warn" style="display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between">
        <span>Delete this job for everyone?</span>
        <span style="display:flex;gap:8px"><button class="btn danger" type="button" id="f-del-yes">Yes, delete</button><button class="btn" type="button" id="f-del-no">Keep it</button></span>
      </div>
    </form>`);
  $("f-confirm").hidden=true;
  wireAddr("f-pickup","fh",j.pickup);wireAddr("f-dropoff","fd",j.dropoff);
  $("jobform").addEventListener("submit",async e=>{
    e.preventDefault();
    const err=$("f-err");
    const body={
      date:$("f-date").value,start:$("f-start").value,hours:$("f-hours").value,
      customer:$("f-customer").value.trim(),phone:$("f-phone").value.trim(),
      pickup:$("f-pickup").value.trim(),dropoff:$("f-dropoff").value.trim(),
      moveType:$("f-type").value,truck:$("f-truck").value,status:$("f-status").value,
      movers:Number($("f-movers").value),leadId:$("f-lead").value,
      crewIds:[...document.querySelectorAll('#f-crew input:checked')].map(i=>i.value).filter(id=>id!==$("f-lead").value),
      weather:$("f-weather").value,weatherNote:$("f-wnote").value.trim(),
      items:$("f-items").value.trim(),notes:$("f-notes").value.trim(),nte:j.nte||"",quoteId:j.quoteId||"",
      house:houseFor("fh",j.house,$("f-pickup").value.trim()!==(j.pickup||"")),
      dropHouse:houseFor("fd",j.dropHouse,$("f-dropoff").value.trim()!==(j.dropoff||""))
    };
    if(!body.date||!body.customer){err.textContent="Add a date and a customer name.";err.hidden=false;return;}
    try{
      const ref=isNew?db.collection("jobs").doc():db.collection("jobs").doc(j.id);
      await ref.set(body);
      const pc=isNew||body.pickup!==(j.pickup||""), dc=isNew||body.dropoff!==(j.dropoff||"");
      if((pc&&body.pickup&&!houseDone(body.house))||(dc&&body.dropoff&&!houseDone(body.dropHouse)))kickLookup("jobs",ref.id,body.customer);
      openJob=ref.id; week=monday(parse(body.date)); month=new Date(parse(body.date).getFullYear(),parse(body.date).getMonth(),1);
      showJob({id:ref.id,...body});
    }catch(x){err.textContent=x&&x.code==="invalid_argument"?"You can view this schedule but not change it.":"Couldn't save. Check your connection and try again.";err.hidden=false;}
  });
  if(!isNew){
    $("f-del").onclick=()=>{$("f-confirm").hidden=false;};
    $("f-del-no").onclick=()=>{$("f-confirm").hidden=true;};
    $("f-del-yes").onclick=async()=>{try{await db.collection("jobs").doc(j.id).delete();closeSheet();}catch(x){$("f-err").textContent="Couldn't delete. Try again.";$("f-err").hidden=false;}};
  }
}

function showCrew(){
  openJob=null;
  const rows=crew.map(c=>`<div class="crewrow"><div><b>${esc(c.name)}</b>${c.role?` · ${esc(c.role)}`:""}${c.phone?`<br><span style="font-size:13px;color:var(--muted)">${esc(c.phone)}</span>`:""}</div>
    <button class="btn danger" data-rmcrew="${esc(c.id)}">Remove</button></div>`).join("")||`<div class="empty">No crew yet. Add your first guy below.</div>`;
  openSheet(`
    <div class="sheethead"><h2 id="sheettitle">Crew</h2><button class="btn icon" data-close aria-label="Close">✕</button></div>
    <div>${rows}</div>
    <form class="edit" id="crewform" novalidate>
      <div class="frow">
        <label class="f">Name<input type="text" id="c-name" required></label>
        <label class="f">Role<select id="c-role"><option>Mover</option><option>Crew lead</option><option>Driver</option><option>Owner</option></select></label>
        <label class="f">Phone<input type="tel" id="c-phone"></label>
      </div>
      <p class="err" id="c-err" hidden></p>
      <div><button class="btn primary" type="submit">Add to crew</button></div>
    </form>`);
  $("crewform").addEventListener("submit",async e=>{
    e.preventDefault();const n=$("c-name").value.trim();
    if(!n){$("c-err").textContent="Add a name.";$("c-err").hidden=false;return;}
    try{await db.collection("crew").doc().set({name:n,role:$("c-role").value,phone:$("c-phone").value.trim()});}
    catch(x){$("c-err").textContent="Couldn't add. Try again.";$("c-err").hidden=false;}
  });
}

document.addEventListener("click",async e=>{
  const t=e.target.closest("[data-job],[data-add],[data-edit],[data-close],[data-rmcrew],[data-gotoweek],[data-claim],[data-clock],[data-invoice],[data-inv],[data-quote],[data-newquote]");
  if(e.target===$("overlay")){closeSheet();return;}
  if(!t)return;
  if(t.dataset.claim){
    const v=$("claim").value;
    try{await db.doc("me/"+uid).set({crewId:v,at:new Date().toISOString()});}
    catch(x){$("claim-err").textContent="Couldn't save. Ask Zach to share this page with you as a Contributor.";$("claim-err").hidden=false;}
    return;
  }
  if(t.dataset.clock){
    t.disabled=true;
    try{
      if(t.dataset.clock==="in") await db.collection("timelog/"+uid+"/entries").doc().set({jobId:curJobId,crewId:myCrew,in:new Date().toISOString(),out:""});
      else{const open=myEntries.find(x=>!x.out); if(open) await db.doc("timelog/"+uid+"/entries/"+open.id).update({out:new Date().toISOString()});}
    }catch(x){$("clock-err").textContent="Couldn't save your time. Ask Zach to share this page with you as a Contributor.";$("clock-err").hidden=false;t.disabled=false;}
    return;
  }
  if(t.dataset.newquote){quoteForm(null);return;}
  if(t.dataset.quote){const q=quotes.find(x=>x.id===t.dataset.quote);if(q)quoteForm(q);return;}
  if(t.dataset.invoice){const j=jobs.find(x=>x.id===t.dataset.invoice);if(j)invoiceForm(j);return;}
  if(t.dataset.inv){const v=findInv(t.dataset.inv);if(v)showInvoice(v);return;}
  if(t.dataset.gotoweek){setView("week");week=monday(parse(t.dataset.gotoweek));render();}
  else if(t.dataset.job){const j=jobs.find(x=>x.id===t.dataset.job);if(j)showJob(j);}
  else if(t.dataset.add!==undefined&&t.dataset.add) editJob(null,t.dataset.add);
  else if(t.dataset.edit){const j=jobs.find(x=>x.id===t.dataset.edit);if(j)editJob(j);}
  else if(t.hasAttribute("data-close")) closeSheet();
  else if(t.dataset.rmcrew){
    if(t.dataset.armed){try{await db.collection("crew").doc(t.dataset.rmcrew).delete();}catch(x){}}
    else{t.dataset.armed="1";t.textContent="Tap again to remove";}
  }
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("overlay").hidden)closeSheet();});
function setView(v){view=v;try{localStorage.setItem("zmc-view",v);}catch(e){}}
$("v-week").onclick=()=>{setView("week");if(week.getMonth()!==month.getMonth()&&addDays(week,6).getMonth()!==month.getMonth())week=monday(month);render();};
$("v-month").onclick=()=>{setView("month");month=new Date(week.getFullYear(),week.getMonth(),1);if(addDays(week,6).getMonth()!==week.getMonth()&&+monday(new Date())===+week)month=new Date(new Date().getFullYear(),new Date().getMonth(),1);render();};
$("prev").onclick=()=>{if(view==="month")month=new Date(month.getFullYear(),month.getMonth()-1,1);else week=addDays(week,-7);render();};
$("next").onclick=()=>{if(view==="month")month=new Date(month.getFullYear(),month.getMonth()+1,1);else week=addDays(week,7);render();};
$("today").onclick=()=>{week=monday(new Date());month=new Date(new Date().getFullYear(),new Date().getMonth(),1);render();};
$("who").onchange=e=>{who=e.target.value;try{localStorage.setItem("zmc-who",who);}catch(x){}render();};
$("newbtn").onclick=()=>editJob(null);
function syncMenu(){
  ["m-biz","m-team"].forEach(g=>{const el=$(g);el.hidden=![...el.querySelectorAll(".mitem")].some(b=>!b.hidden);});
  $("menubtn").hidden=["m-view","m-biz","m-team"].every(g=>$(g).hidden);
}
function setMenu(open){$("menu").hidden=!open;$("menubtn").setAttribute("aria-expanded",open);}
$("menubtn").onclick=e=>{e.stopPropagation();setMenu($("menu").hidden);};
$("lb-close").onclick=closePhoto;
$("lb-del").onclick=()=>{$("lb-confirm").hidden=false;};
$("lb-no").onclick=()=>{$("lb-confirm").hidden=true;};
$("lb-yes").onclick=async()=>{if(!lbPhoto)return;try{await db.doc(lbPhoto._path).delete();closePhoto();}catch(x){$("lb-cap").textContent="Couldn't delete. Try again.";}};
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("lightbox").hidden){e.stopPropagation();closePhoto();}},true);
document.addEventListener("click",e=>{const t=e.target.closest("[data-photo]");if(t){e.preventDefault();openPhoto(t.dataset.photo,Number(t.dataset.pi));}});

$("photoinput").addEventListener("change",async()=>{
  const inp=$("photoinput"); if(!inp.files||!inp.files.length)return;
  let pk=inp.dataset.pk||""; const files=[...inp.files]; inp.value="";
  if(pk==="quotes:"){
    const sv=typeof quoteSaver==="function"?await quoteSaver():null;
    if(!sv){pstatus[pk]="Add the customer's name first, then add photos.";paintPhotos();return;}
    const npk="quotes:"+sv.id;
    document.querySelectorAll('[data-pk="quotes:"]').forEach(x=>x.dataset.pk=npk);
    document.querySelectorAll('[data-addphoto="quotes:"]').forEach(x=>x.dataset.addphoto=npk);
    document.querySelectorAll('[data-pstat="quotes:"]').forEach(x=>x.dataset.pstat=npk);
    delete pstatus[pk]; pk=npk; subOffice(pk);
  }
  if(pk)addPhotos(pk,files);
});
document.addEventListener("click",e=>{if(!$("menu").hidden&&!e.target.closest(".menuwrap"))setMenu(false);});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("menu").hidden){setMenu(false);$("menubtn").focus();}});

(async()=>{
  const C=window.claude;
  db=C?await C.use("db"):null;
  if(!db){$("banner").textContent="Sign in to see the schedule. If you're signed in, ask Zach to share this page with you.";$("banner").hidden=false;loaded.jobs=true;render();return;}
  const user=await C.use("user");
  const w=user?await user.can("data.write"):null;
  canWrite=w===true||(w===null&&(user?await user.canEdit():false));
  $("newbtn").hidden=!canWrite;$("crewbtn").hidden=!canWrite;
  uid=user?await user.id():null;
  $("invbtn").hidden=!canWrite; $("quotebtn").hidden=!canWrite; $("custbtn").hidden=!canWrite; $("repbtn").hidden=!canWrite; syncMenu();
  if(canWrite){
    db.collection("quotes").onSnapshot(s=>{quotes=s.docs.map(d=>({id:d.id,...d.data()}));
      const n=quotes.filter(q=>q.status==="new").length; $("quotebadge").textContent=n+" new";$("quotebadge").hidden=!n;$("menudot").hidden=!n;},()=>{});
    C.use("sample").then(sm=>{sampler=sm;}).catch(()=>{});
    db.collection("settings").doc("app").onSnapshot(d=>{if(d&&d.exists){const v=d.data()||{};LOOKUP_TASK=v.lookupTask||"";}},()=>{});
  }
  if(uid){subInvoices(uid); if(!canWrite)subCrewPhotos(uid);}
  if(!canWrite&&uid){
    db.doc("me/"+uid).onSnapshot(s=>{myCrew=s.exists?(s.data().crewId||""):"";render();},()=>{});
    db.collection("timelog/"+uid+"/entries").onSnapshot(s=>{myEntries=s.docs.map(d=>({id:d.id,...d.data()}));render();},()=>{});
  }
  if(canWrite){
    db.collection("me").onSnapshot(s=>{
      s.docs.forEach(d=>{const u=d.id; subInvoices(u); subCrewPhotos(u);
        if(!logSubs[u]&&Object.keys(logSubs).length<50)
          logSubs[u]=db.collection("timelog/"+u+"/entries").onSnapshot(q=>{logs[u]=q.docs.map(x=>({id:x.id,...x.data()}));render();},()=>{});
      });
    },()=>{});
  }
  if(canWrite)db.collection("lookups").onSnapshot(q=>{pastLooks=q.docs.map(d=>d.data());},()=>{});
  db.collection("forecast").doc("stockton").onSnapshot(d=>{if(d&&d.exists){forecast=(d.data()||{}).days||{};render();}},()=>{});
  const timer=setTimeout(()=>{if(!loaded.jobs){$("banner").textContent="Can't reach the schedule yet. Check your connection; it will load when it can.";$("banner").hidden=false;}},10000);
  db.collection("crew").onSnapshot(s=>{
    crew=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>{const r={Owner:0,"Crew lead":1,Driver:2,Mover:3};return (r[a.role]??4)-(r[b.role]??4)||a.name.localeCompare(b.name);});
    loaded.crew=true;render();
    if(!$("overlay").hidden&&$("sheettitle")&&$("sheettitle").textContent==="Crew")showCrew();
  },()=>{});
  db.collection("jobs").onSnapshot(s=>{
    jobs=s.docs.map(d=>({id:d.id,...d.data()}));
    if(!s.metadata.fromCache){loaded.jobs=true;clearTimeout(timer);$("banner").hidden=true;}
    else loaded.jobs=true;
    render();
  },err=>{clearTimeout(timer);$("banner").textContent="The schedule couldn't load. Refresh the page to try again.";$("banner").hidden=false;});
})();
</script>
